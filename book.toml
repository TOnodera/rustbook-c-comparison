[book]
title = "The Rust Programming Language 日本語訳・C言語比較"
authors = ["Steve Klabnik", "Carol Nichols", "Chris Krycho", "Contributions from the Rust Community", "日本語訳: TOnodera/rustbook-c-comparison contributors"]
language = "ja"
multilingual = false
src = "src"

[rust]
edition = "2024"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/TOnodera/rustbook-c-comparison"
edit-url-template = "https://github.com/TOnodera/rustbook-c-comparison/edit/main/{path}"
site-url = "/rustbook-c-comparison/"
